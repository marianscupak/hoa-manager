name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    checks:
        name: Checks
        uses: ./.github/workflows/ci.yml

    build:
        name: Build & push images
        needs: checks
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push API image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/api/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}-api:latest
                      ghcr.io/${{ github.repository }}-api:${{ github.sha }}
                  # Single-manifest image: attestation manifests confuse the
                  # GHCR version cleanup and break pulls when pruned.
                  provenance: false
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,scope=api,mode=max

            - name: Build & push web image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/portal/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}-web:latest
                      ghcr.io/${{ github.repository }}-web:${{ github.sha }}
                  provenance: false
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,scope=web,mode=max

    cleanup:
        # Private-repo GHCR free storage is 500 MB — prune old image versions.
        # Runs only after a successful deploy so a pull in flight can never
        # race against version deletion.
        name: Prune old GHCR versions
        needs: deploy
        runs-on: ubuntu-latest
        permissions:
            packages: write
        steps:
            - name: Prune API image versions
              uses: actions/delete-package-versions@v5
              with:
                  package-name: hoa-manager-api
                  package-type: container
                  min-versions-to-keep: 2

            - name: Prune web image versions
              uses: actions/delete-package-versions@v5
              with:
                  package-name: hoa-manager-web
                  package-type: container
                  min-versions-to-keep: 2

    deploy:
        name: Deploy to server
        needs: build
        runs-on: ubuntu-latest
        env:
            SSH_DEST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
            # Non-secret configuration, rendered into the server .env below.
            # Secrets live in GitHub Actions secrets (gh secret set <NAME>).
            DOMAIN: hoa.marianscupak.com
            POSTGRES_USER: hoa_manager
            POSTGRES_DB: hoa_manager
            R2_ACCOUNT_ID: 54ebd2c5a7c6e4c79d811f17370de033
            R2_BUCKET: hoa-manager-backups
            R2_ENDPOINT: https://54ebd2c5a7c6e4c79d811f17370de033.eu.r2.cloudflarestorage.com
            R2_UPLOADS_BUCKET: hoa-manager-uploads
            R2_UPLOADS_ENDPOINT: https://54ebd2c5a7c6e4c79d811f17370de033.eu.r2.cloudflarestorage.com
            EMAIL_FROM: noreply@hoa.marianscupak.com
            EMAIL_FROM_NAME: HOA Manager
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
                  echo "IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config

            - name: Render .env from secrets
              env:
                  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
                  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
                  JWT_SECRET: ${{ secrets.JWT_SECRET }}
                  POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
                  GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
                  R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
                  R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
                  R2_UPLOADS_ACCESS_KEY_ID: ${{ secrets.R2_UPLOADS_ACCESS_KEY_ID }}
                  R2_UPLOADS_SECRET_ACCESS_KEY: ${{ secrets.R2_UPLOADS_SECRET_ACCESS_KEY }}
                  BREVO_API_KEY: ${{ secrets.BREVO_API_KEY }}
              run: |
                  cat > server.env <<EOF
                  # Rendered by deploy.yml from GitHub Actions secrets.
                  # Do NOT edit on the server — every deploy overwrites this file.
                  # Change values via: gh secret set <NAME>  (or deploy.yml env)
                  DOMAIN=${DOMAIN}
                  GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
                  GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
                  GOOGLE_REDIRECT_URI=https://${DOMAIN}/api/auth/google/callback
                  FRONTEND_URL=https://${DOMAIN}
                  CORS_ORIGINS=https://${DOMAIN}
                  JWT_SECRET=${JWT_SECRET}
                  POSTGRES_USER=${POSTGRES_USER}
                  POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
                  POSTGRES_DB=${POSTGRES_DB}
                  DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
                  GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
                  R2_ACCOUNT_ID=${R2_ACCOUNT_ID}
                  R2_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID}
                  R2_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY}
                  R2_BUCKET=${R2_BUCKET}
                  R2_ENDPOINT=${R2_ENDPOINT}
                  R2_UPLOADS_BUCKET=${R2_UPLOADS_ACCESS_KEY_ID:+${R2_UPLOADS_BUCKET}}
                  R2_UPLOADS_ENDPOINT=${R2_UPLOADS_ACCESS_KEY_ID:+${R2_UPLOADS_ENDPOINT}}
                  R2_UPLOADS_ACCESS_KEY_ID=${R2_UPLOADS_ACCESS_KEY_ID}
                  R2_UPLOADS_SECRET_ACCESS_KEY=${R2_UPLOADS_SECRET_ACCESS_KEY}
                  BREVO_API_KEY=${BREVO_API_KEY}
                  EMAIL_FROM=${BREVO_API_KEY:+${EMAIL_FROM}}
                  EMAIL_FROM_NAME=${BREVO_API_KEY:+${EMAIL_FROM_NAME}}
                  EOF

            - name: Copy configuration to server
              run: |
                  ssh "$SSH_DEST" 'mkdir -p /opt/hoa-manager/docker'
                  scp docker-compose.prod.yml "$SSH_DEST":/opt/hoa-manager/docker-compose.yml
                  scp -r docker/prometheus docker/loki docker/promtail docker/grafana "$SSH_DEST":/opt/hoa-manager/docker/
                  scp docker/backup/backup.sh "$SSH_DEST":/opt/hoa-manager/backup.sh
                  scp server.env "$SSH_DEST":/opt/hoa-manager/.env
                  rm server.env
                  ssh "$SSH_DEST" 'chmod +x /opt/hoa-manager/backup.sh && chmod 600 /opt/hoa-manager/.env'

            - name: Pull images, migrate, restart
              run: |
                  ssh "$SSH_DEST" 'cd /opt/hoa-manager \
                    && docker compose pull \
                    && docker compose run --rm api node dist/infrastructure/db/migrate \
                    && docker compose up -d --remove-orphans \
                    && docker image prune -f'

            - name: Verify the deployed API answers
              run: |
                  # `docker compose up -d` returns once the containers exist,
                  # not once they work, so an API crash-looping on a bad
                  # migration or config would otherwise deploy green. Calling
                  # the public URL exercises the whole chain — DNS, Caddy, the
                  # API process and its database connection.
                  for attempt in $(seq 1 30); do
                      if curl -fsS --max-time 5 "https://${DOMAIN}/api/health" | grep -q '"status":"ok"'; then
                          echo "API reported healthy after ${attempt} attempt(s)."
                          exit 0
                      fi
                      echo "Attempt ${attempt}/30: not healthy yet, retrying in 5s."
                      sleep 5
                  done
                  echo "::error::API did not report healthy within 150s of deploy."
                  ssh "$SSH_DEST" 'cd /opt/hoa-manager && docker compose logs --tail 50 api' || true
                  exit 1
