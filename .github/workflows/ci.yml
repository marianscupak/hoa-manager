name: CI

on:
    pull_request:
        branches: [main]
    workflow_call:

jobs:
    ci:
        name: Typecheck, Lint & Build
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 8.15.6

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: pnpm

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Typecheck
              run: pnpm typecheck

            - name: Lint
              run: pnpm lint

            - name: Format check
              run: pnpm format:check

            - name: Test
              run: pnpm test

            - name: Build
              run: pnpm build

            - name: Check the generated API contract is up to date
              env:
                  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
                  CORS_ORIGINS: http://localhost:5173
                  JWT_SECRET: ci-placeholder-secret-at-least-32-characters
                  FRONTEND_URL: http://localhost:5173
              run: |
                  pnpm --filter @hoa-mngr/api generate
                  pnpm --filter @hoa-mngr/portal generate
                  if [ -n "$(git status --porcelain -- apps/api/openapi-spec.json apps/portal/src/api/generated)" ]; then
                      git status --short -- apps/api/openapi-spec.json apps/portal/src/api/generated
                      echo "::error::The generated API contract is out of date. Run 'pnpm generate' and commit the result."
                      exit 1
                  fi
