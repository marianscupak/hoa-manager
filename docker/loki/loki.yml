auth_enabled: false

server:
    http_listen_port: 3100
    grpc_listen_port: 9096

common:
    instance_addr: 127.0.0.1
    path_prefix: /loki
    storage:
        filesystem:
            chunks_directory: /loki/chunks
            rules_directory: /loki/rules
    replication_factor: 1
    ring:
        kvstore:
            store: inmemory

query_range:
    results_cache:
        cache:
            embedded_cache:
                enabled: true
                max_size_mb: 100

schema_config:
    configs:
        - from: 2020-10-24
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
              prefix: index_
              period: 24h

# Without this, Loki keeps every line forever. Matched to Prometheus's
# --storage.tsdb.retention.time=30d so the two halves of the dashboard cover
# the same window, and so a mistakenly logged secret ages out rather than
# sitting on the disk for the life of the server.
limits_config:
    retention_period: 30d

compactor:
    working_directory: /loki/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem

ruler:
    alertmanager_url: http://localhost:9093
