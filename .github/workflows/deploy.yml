name: Deploy

on:
    push:
        branches: [main]
    workflow_dispatch:

concurrency:
    group: deploy-production
    cancel-in-progress: false

jobs:
    checks:
        name: Checks
        uses: ./.github/workflows/ci.yml

    build:
        name: Build & push images
        needs: checks
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build & push API image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/api/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}-api:latest
                      ghcr.io/${{ github.repository }}-api:${{ github.sha }}
                  # Single-manifest image: attestation manifests confuse the
                  # GHCR version cleanup and break pulls when pruned.
                  provenance: false
                  cache-from: type=gha,scope=api
                  cache-to: type=gha,scope=api,mode=max

            - name: Build & push web image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  file: apps/portal/Dockerfile
                  push: true
                  tags: |
                      ghcr.io/${{ github.repository }}-web:latest
                      ghcr.io/${{ github.repository }}-web:${{ github.sha }}
                  provenance: false
                  cache-from: type=gha,scope=web
                  cache-to: type=gha,scope=web,mode=max

    cleanup:
        # Private-repo GHCR free storage is 500 MB — prune old image versions.
        # Runs only after a successful deploy so a pull in flight can never
        # race against version deletion.
        name: Prune old GHCR versions
        needs: deploy
        runs-on: ubuntu-latest
        permissions:
            packages: write
        steps:
            - name: Prune API image versions
              uses: actions/delete-package-versions@v5
              with:
                  package-name: hoa-manager-api
                  package-type: container
                  min-versions-to-keep: 2

            - name: Prune web image versions
              uses: actions/delete-package-versions@v5
              with:
                  package-name: hoa-manager-web
                  package-type: container
                  min-versions-to-keep: 2

    deploy:
        name: Deploy to server
        needs: build
        runs-on: ubuntu-latest
        env:
            SSH_DEST: ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup SSH
              run: |
                  mkdir -p ~/.ssh
                  echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
                  chmod 600 ~/.ssh/deploy_key
                  ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts
                  echo "IdentityFile ~/.ssh/deploy_key" >> ~/.ssh/config

            - name: Copy configuration to server
              run: |
                  ssh "$SSH_DEST" 'mkdir -p /opt/hoa-manager/docker'
                  scp docker-compose.prod.yml "$SSH_DEST":/opt/hoa-manager/docker-compose.yml
                  scp -r docker/prometheus docker/loki docker/promtail docker/grafana "$SSH_DEST":/opt/hoa-manager/docker/
                  scp docker/backup/backup.sh "$SSH_DEST":/opt/hoa-manager/backup.sh
                  ssh "$SSH_DEST" 'chmod +x /opt/hoa-manager/backup.sh'

            - name: Pull images, migrate, restart
              run: |
                  ssh "$SSH_DEST" 'cd /opt/hoa-manager \
                    && docker compose pull \
                    && docker compose run --rm api node dist/infrastructure/db/migrate \
                    && docker compose up -d --remove-orphans \
                    && docker image prune -f'
